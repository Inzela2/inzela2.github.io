<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inzela Mirza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --display:'Silkscreen','Courier New',monospace;
  --body:'Nunito','Segoe UI',system-ui,sans-serif;
  --bg:#ffcfe3; --bg2:#ffe4f0; --ink:#3a1028; --muted:#8c3a5e;
  --hot:#e8207a; --hot-dk:#a8125a; --soft:#ff9cc8; --cream:#fff7fb;
  --grid:rgba(232,32,122,.13);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#ffcfe3}}
:root[data-theme="dark"]{--bg:#ffcfe3}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:inherit}
[hidden]{display:none!important}
body{
  margin:0;font-family:var(--body);color:var(--ink);line-height:1.55;
  background-color:var(--bg);
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px),
    radial-gradient(ellipse at 50% 35%,var(--bg2) 0%,transparent 65%);
  background-size:28px 28px,28px 28px,100% 100%;
  min-height:100vh;overflow-x:hidden;
}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--hot);outline-offset:3px}

/* floating pixel confetti in background */
.bits{position:fixed;inset:0;pointer-events:none;z-index:0}
.bits i{position:absolute;width:8px;height:8px;background:var(--soft);animation:drift 9s steps(18) infinite}
@keyframes drift{0%{transform:translateY(0);opacity:0}15%{opacity:.8}100%{transform:translateY(-140px);opacity:0}}

/* header */
.top{position:relative;z-index:2;text-align:center;padding:22px 16px 0}
.switch{position:absolute;right:clamp(12px,3vw,32px);top:18px;display:flex;gap:4px;background:var(--cream);border:3px solid var(--hot);border-radius:12px;padding:3px;box-shadow:0 4px 0 var(--hot-dk)}
.switch button{border:0;background:transparent;border-radius:8px;padding:6px 12px;font-weight:900;font-size:13px;color:var(--muted)}
.switch button[aria-pressed="true"]{background:var(--hot);color:#fff}
h1.name{
  font-family:var(--display);font-weight:700;margin:0;line-height:1.05;
  font-size:clamp(40px,8.5vw,96px);color:var(--cream);letter-spacing:.01em;
  text-shadow:3px 3px 0 var(--hot),6px 6px 0 var(--hot-dk),9px 9px 0 rgba(58,16,40,.25);
}
.sub{margin:14px auto 0;font-weight:800;font-size:clamp(15px,2.2vw,20px);color:var(--hot-dk);
  display:inline-block;background:var(--cream);border:3px solid var(--hot);border-radius:999px;padding:6px 18px;box-shadow:0 4px 0 var(--hot-dk)}

/* ---------- bubbles ---------- */
.bubble{
  --s:178px;position:absolute;width:var(--s);height:var(--s);border-radius:50%;
  background:var(--cream);border:4px solid var(--hot);
  box-shadow:0 7px 0 var(--hot-dk),0 14px 26px rgba(168,18,90,.25);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  padding:16px 14px;text-align:center;transform:translate(-50%,-50%);
  transition:transform .15s ease,box-shadow .15s ease;z-index:3;
}
.bubble::before{ /* lego studs ring */
  content:"";position:absolute;inset:7px;border-radius:50%;border:2px dashed var(--soft);pointer-events:none;
}
.bubble:hover,.bubble:focus-visible{transform:translate(-50%,calc(-50% - 6px));box-shadow:0 13px 0 var(--hot-dk),0 22px 30px rgba(168,18,90,.3)}
.bubble:active{transform:translate(-50%,calc(-50% + 3px));box-shadow:0 3px 0 var(--hot-dk)}
.bubble svg{width:46px;height:46px;image-rendering:pixelated}
.bubble .kind{font-size:10px;font-weight:900;background:var(--hot);color:#fff;border-radius:4px;padding:1px 7px;letter-spacing:.02em}
.bubble .t{font-family:var(--display);font-size:11.5px;line-height:1.2;max-width:128px}
.bubble .st{font-size:11px;font-weight:800;color:var(--muted);line-height:1.2;max-width:130px}

/* ---------- option 1: centre photo ---------- */
.opt1{position:relative;z-index:1;width:min(1240px,100%);margin:0 auto;height:max(700px,calc(100vh - 160px))}
.opt1 .orbit{position:absolute;left:50%;top:52%;width:80%;height:84%;transform:translate(-50%,-50%);border:3px dashed rgba(232,32,122,.35);border-radius:50%}
.opt1 .orbit2{width:56%;height:64%;border-style:dotted}
.opt1 .halo{position:absolute;left:50%;bottom:4%;width:min(440px,42%);aspect-ratio:1;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(circle,#fff 0%,rgba(255,255,255,.55) 45%,transparent 70%)}
.opt1 .me{position:absolute;left:50%;bottom:44px;height:calc(100% - 64px);transform:translateX(-50%);z-index:2;
  filter:drop-shadow(0 10px 0 rgba(232,32,122,.25))}
.base{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(520px,70%);height:48px;z-index:2;
  background:var(--hot);border-radius:8px;box-shadow:0 6px 0 var(--hot-dk);
  background-image:radial-gradient(circle at 50% 40%,#ff5fa6 0 6px,transparent 6.5px);background-size:26px 26px;background-position:0 -2px}
.base span{position:absolute;inset:auto 0 9px;text-align:center;color:#fff;font-family:var(--display);font-size:12px}

/* ---------- option 2: side photo ---------- */
.opt2{position:relative;z-index:1;width:min(1240px,100%);margin:20px auto 0;display:grid;grid-template-columns:1.45fr 1fr;gap:20px;align-items:center;padding:0 clamp(16px,3vw,32px) 40px}
.cluster{position:relative;height:700px}
.cluster svg.traces{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.card{position:relative;background:var(--cream);border:4px solid var(--hot);border-radius:18px;padding:14px 14px 18px;box-shadow:0 8px 0 var(--hot-dk),0 20px 40px rgba(168,18,90,.25);transform:rotate(2deg)}
.card::before{content:"";position:absolute;left:18px;right:18px;top:-14px;height:14px;
  background:radial-gradient(circle at 50% 100%,var(--hot) 0 8px,transparent 8.5px);background-size:30px 14px}
.card img{display:block;width:100%;border-radius:10px;aspect-ratio:675/1000;object-fit:cover}
.card .cap{margin:12px 4px 0;font-weight:700;font-size:15px}
.card .cap b{font-family:var(--display);font-size:13px;color:var(--hot-dk);display:block;margin-bottom:2px}
.tape{position:absolute;top:-6px;right:24px;width:64px;height:22px;background:rgba(255,156,200,.75);transform:rotate(-8deg)}

.contact{position:relative;z-index:2;text-align:center;margin:26px 0 30px;font-weight:700;font-size:14px;color:var(--muted)}
.contact a{color:var(--hot-dk);font-weight:900}

/* mobile */
@media (max-width:900px){
  .switch{position:static;margin:0 auto 14px;width:max-content}
  .opt1{height:auto;padding-bottom:20px}
  .opt1 .orbit{display:none}
  .opt1 .stagewrap{position:relative;height:62vh;min-height:440px}
  .opt1 .me{height:calc(100% - 30px);bottom:30px}
  .base{height:34px}
  .base span{bottom:5px;font-size:10px}
  .bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 14px;padding:26px 14px 0;justify-items:center}
  .bgrid .bubble{position:relative;left:auto!important;top:auto!important;transform:none;--s:158px}
  .bgrid .bubble:hover{transform:translateY(-6px)}
  .opt2{grid-template-columns:1fr}
  .opt2 .side{order:-1;max-width:340px;margin:10px auto 0}
  .cluster{height:auto}
  .cluster svg.traces{display:none}
}
@media (min-width:901px){.opt1 .stagewrap{position:absolute;inset:0}}

/* ---------- story page ---------- */
.page{position:fixed;inset:0;overflow:auto;z-index:20;display:none;background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
.page.open{display:block}
.ptop{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:14px;padding:calc(12px + env(safe-area-inset-top,0px)) clamp(14px,4vw,40px) 12px;background:var(--bg);border-bottom:3px solid var(--soft)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.back{display:inline-flex;align-items:center;gap:8px;border:3px solid var(--hot);background:var(--cream);color:var(--hot-dk);border-radius:12px;padding:8px 18px 8px 14px;font-weight:900;font-size:16px;box-shadow:0 5px 0 var(--hot-dk)}
.back:hover{background:var(--hot);color:#fff}
.back:active{transform:translateY(3px);box-shadow:0 2px 0 var(--hot-dk)}
.ptop .crumb{font-family:var(--display);font-size:12px;color:var(--muted);margin-left:auto}
.story{max-width:1000px;margin:0 auto;padding:22px clamp(14px,4vw,40px) 60px}
.story .kind{display:inline-block;font-weight:900;font-size:12px;background:var(--hot);color:#fff;padding:3px 10px;border-radius:6px}
.story h2{font-family:var(--display);font-size:clamp(20px,3.8vw,34px);margin:10px 0 2px;line-height:1.2}
.story .where{color:var(--muted);font-weight:800;margin:0 0 14px}
.impact{margin:0 0 16px;background:var(--cream);border:3px solid var(--hot);border-left-width:12px;border-radius:12px;padding:10px 16px;font-weight:900;font-size:clamp(17px,2.4vw,22px);line-height:1.3;box-shadow:0 5px 0 var(--hot-dk)}
.impact span{display:block;font-family:var(--display);font-size:11px;font-weight:400;color:var(--hot);margin-bottom:2px}
.stackrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 14px}
.stackrow b{font-family:var(--display);font-size:12px;color:var(--hot-dk);margin-right:4px}
.chip{background:var(--cream);border:2px solid var(--hot);padding:4px 11px;border-radius:5px;font-weight:900;font-size:13px;box-shadow:3px 3px 0 var(--hot)}
.scene{background:var(--cream);border:4px solid var(--hot);border-radius:18px;padding:10px;box-shadow:0 8px 0 var(--hot-dk)}
.scene svg{display:block;width:100%;height:auto;border-radius:10px}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:26px 0 0}
.num{background:var(--hot);color:#fff;border-radius:12px;padding:14px 14px 12px;box-shadow:0 6px 0 var(--hot-dk);position:relative}
.num::before{content:"";position:absolute;left:12px;right:12px;top:-8px;height:8px;background:radial-gradient(circle at 50% 100%,var(--hot) 0 6px,transparent 6.5px);background-size:22px 8px}
.num .v{font-family:var(--display);font-size:clamp(20px,3vw,28px);line-height:1.1}
.num .l{font-size:13px;font-weight:800;opacity:.92;line-height:1.3;margin-top:4px}
.beats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px}
.beat{background:var(--cream);border:3px solid var(--soft);border-radius:14px;padding:14px 16px}
.beat h3{font-family:var(--display);font-size:13px;color:var(--hot-dk);margin:0 0 6px}
.beat p{margin:0;font-size:15px}
.links{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.cta{display:inline-flex;align-items:center;gap:8px;text-decoration:none;background:var(--ink);color:#fff;font-weight:900;font-size:16px;padding:12px 20px;border-radius:12px;box-shadow:0 5px 0 var(--hot)}
.cta:hover{background:var(--hot-dk)}
.pnav{display:flex;justify-content:space-between;gap:12px;margin-top:30px}
.pnav button{border:3px solid var(--soft);background:var(--cream);border-radius:12px;padding:10px 14px;font-weight:800;color:var(--muted);text-align:left;max-width:48%}
.pnav button span{display:block;font-family:var(--display);font-size:10px;color:var(--hot)}
@media (max-width:760px){.nums{grid-template-columns:repeat(2,1fr)}.beats{grid-template-columns:1fr}}

/* ---------- phone polish ---------- */
.taphint{display:none}
@media (max-width:900px){
  .top{padding-top:18px}
  .sub{font-size:13.5px;padding:6px 14px}
  .taphint{display:block;text-align:center;margin:22px 0 0;font-family:var(--display);font-size:12px;color:var(--hot-dk)}
  .bgrid{grid-template-columns:repeat(2,1fr)!important;gap:14px 12px!important;padding:14px 12px 96px!important;max-width:440px;margin:0 auto}
  .bgrid .bubble{--s:min(170px,calc((100vw - 48px)/2));padding:10px 8px;gap:2px;margin:0 auto}
  .bgrid .bubble:nth-child(even){transform:translateY(48%)}
  .bgrid .bubble:hover,.bgrid .bubble:focus-visible{transform:none}
  .bgrid .bubble:nth-child(even):hover,.bgrid .bubble:nth-child(even):focus-visible{transform:translateY(48%)}
  .bgrid .bubble:active{transform:translateY(3px)}
  .bgrid .bubble:nth-child(even):active{transform:translateY(calc(48% + 3px))}
  .bubble::before{inset:5px}
  .bubble svg{width:36px;height:36px}
  .bubble .kind{font-size:9.5px}
  .bubble .t{font-size:10px;max-width:78%}
  .bubble .st{font-size:10px;max-width:72%}
  .contact{margin-top:6px}
  .story{padding-top:16px}
  .stackrow{gap:6px}
  .chip{font-size:12px;padding:3px 9px;box-shadow:2px 2px 0 var(--hot)}
  .scene{padding:4px;margin:0 -6px;border-width:3px;border-radius:14px}
  .scene svg{border-radius:9px}
  .nums{gap:16px 10px}
  .num{padding:12px 12px 10px}
  .num .l{font-size:12px}
  .beat p{font-size:14.5px}
  .cta{width:100%;justify-content:center}
}

/* ---------- pixel animations (SVG) ---------- */
svg .mv{animation:mv var(--d,4s) linear infinite;animation-delay:var(--dl,0s)}
@keyframes mv{from{transform:translate(0,0)}to{transform:translate(var(--dx,0px),var(--dy,0px))}}
svg .mvs{animation:mvs var(--d,4s) steps(var(--n,20)) infinite;animation-delay:var(--dl,0s)}
@keyframes mvs{from{transform:translate(0,0)}to{transform:translate(var(--dx,0px),var(--dy,0px))}}
svg .fly{animation:fly var(--d,3s) steps(14) infinite;animation-delay:var(--dl,0s)}
@keyframes fly{0%{transform:translate(0,0);opacity:0}10%{opacity:1}85%{opacity:1}100%{transform:translate(var(--dx,0px),var(--dy,0px));opacity:0}}
svg .blink{animation:blink var(--d,1s) steps(1) infinite;animation-delay:var(--dl,0s)}
@keyframes blink{50%{opacity:0}}
svg .bob{animation:bob var(--d,1s) steps(1) infinite;animation-delay:var(--dl,0s)}
@keyframes bob{50%{transform:translateY(-1px)}}
svg .bob2{animation:bob2 var(--d,1.2s) steps(1) infinite;animation-delay:var(--dl,0s)}
@keyframes bob2{50%{transform:translateY(-2px)}}
svg .spin{transform-box:fill-box;transform-origin:center;animation:spin var(--d,1s) steps(8) infinite}
@keyframes spin{to{transform:rotate(360deg)}}
svg .pop{transform-box:fill-box;transform-origin:50% 100%;animation:pop var(--d,4s) steps(6) infinite;animation-delay:var(--dl,0s)}
@keyframes pop{0%,8%{transform:scale(0)}20%,85%{transform:scale(1)}100%{transform:scale(0)}}
svg .grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow var(--d,4s) steps(8) infinite;animation-delay:var(--dl,0s)}
@keyframes grow{0%{transform:scaleY(.1)}60%,90%{transform:scaleY(1)}100%{transform:scaleY(.1)}}
svg .growx{transform-box:fill-box;transform-origin:0 50%;animation:growx var(--d,4s) steps(10) infinite;animation-delay:var(--dl,0s)}
@keyframes growx{0%{transform:scaleX(.05)}70%,92%{transform:scaleX(1)}100%{transform:scaleX(.05)}}
svg .pulse{transform-box:fill-box;transform-origin:center;animation:pulse var(--d,2s) steps(6) infinite;animation-delay:var(--dl,0s)}
@keyframes pulse{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.3);opacity:0}}
svg .scany{animation:scany var(--d,3s) steps(16) infinite alternate}
@keyframes scany{to{transform:translateY(var(--dy,20px))}}
svg .fade{animation:fade var(--d,2s) steps(2) infinite;animation-delay:var(--dl,0s)}
@keyframes fade{0%,100%{opacity:.25}50%{opacity:.85}}
@media (prefers-reduced-motion:reduce){*,svg *{animation:none!important;transition:none!important}.bits{display:none}}
</style>
</head>

</header>

<script>
/* ================= pixel toolkit ================= */
const C={k:'#1f1430',K:'#3b2a4d',w:'#ffffff',n:'#f4eef7',c:'#d6cbe0',C:'#9a8aa8',D:'#5d4e6d',
 p:'#ffb3d1',P:'#ff5fa6',H:'#e8207a',Hd:'#a8125a',m:'#d8c4ff',M:'#8b5cf6',Md:'#5b2fc4',
 b:'#9fd4ff',B:'#3b82f6',Bd:'#1e40af',s:'#e0f2ff',g:'#86efac',G:'#22c55e',Gd:'#15803d',l:'#d9f99d',
 y:'#fde68a',Y:'#facc15',Yd:'#ca8a04',o:'#fdba74',O:'#f97316',r:'#fca5a5',R:'#ef4444',Rd:'#b91c1c',
 t:'#e6c39a',T:'#a0683a',Td:'#6b3f1d',d:'#f2c4a2',dd:'#c98b62',x:'#7a4a2c'};
const R=(x,y,w,h,f,a='')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${C[f]||f}" ${a}/>`;
const T=(x,y,s,txt,f='k',anchor='start',a='')=>`<text x="${x}" y="${y}" font-family="Silkscreen,monospace" font-size="${s}" fill="${C[f]||f}" text-anchor="${anchor}" ${a}>${txt}</text>`;
const G=(cls,inner,st='')=>`<g class="${cls}" style="${st}">${inner}</g>`;
/* sprite: rows of chars, '.' transparent, map chars to palette keys */
const SP=(rows,x,y,map={})=>{let o='';rows.forEach((row,j)=>{let i=0;while(i<row.length){const ch=row[i];if(ch==='.'){i++;continue}let k=i;while(k<row.length&&row[k]===ch)k++;const col=map[ch]||C[ch];if(col)o+=`<rect x="${x+i}" y="${y+j}" width="${k-i}" height="1" fill="${C[col]||col}"/>`;i=k}});return o};
/* lego brick with studs */
const brick=(x,y,w,h,f,dk)=>{let o=R(x,y,w,h,f)+R(x,y+h-1,w,1,dk)+R(x,y,1,h,'#ffffff','opacity=".25"');for(let i=x+1;i<x+w-1;i+=4)o+=R(i,y-1,2,1,f);return o};
const box=(x,y,w,h,f,line='k')=>R(x,y,w,h,line)+R(x+1,y+1,w-2,h-2,f);
const svg=(inner,bg)=>`<svg viewBox="0 0 160 90" shape-rendering="crispEdges" role="img">${R(0,0,160,90,bg)}${inner}</svg>`;
const person=(x,y,shirt,hair='k',skin='d')=>SP(['.hhh.','hsss.','.sss.','ttttt','tttt.','.LL..','.L.L.'],x,y,{h:hair,s:skin,t:shirt,L:'K'});

/* ================= scenes ================= */
const scenes={};

scenes.inventia=()=>{let o='';
 // wall + shelf
 o+=R(0,0,160,62,'#fbeef6');for(let i=0;i<160;i+=16)o+=R(i,0,1,62,'#f3dbe9');

 [['b',6],['p',12],['g',18],['y',24],['m',30],['b',36],['P',42]].forEach(([c,x],i)=>{o+=R(x,3,4,7,c)+R(x+1,2,2,1,'C')+R(x,3,4,1,'w','opacity=".5"')});
 // window with DNA-ish poster
 o+=box(58,6,24,18,'s','C')+R(69,7,1,16,'C')+R(59,14,22,1,'C');
 o+=box(122,6,30,22,'w','H')+T(137,13,4,'DRUG','Hd','middle')+T(137,18,4,'SCREEN','Hd','middle')+T(137,24,4,'x4','H','middle');
 // bench
 o+=R(0,62,160,4,'C')+R(0,66,160,2,'D')+R(0,68,160,22,'#e9dff0');
 for(let i=0;i<160;i+=8)o+=R(i,76,8,1,'c');
 o+=R(6,68,3,22,'D')+R(150,68,3,22,'D');
 // microscope (detailed)
 o+=SP([
 '......kkkk......',

 // well plate on stage
 o+=box(9,51,10,4,'w','k');for(let i=0;i<4;i++)o+=G('blink',R(10+i*2,52,1,1,['G','P','B','Y'][i]),`--d:${1+i*.3}s`);
 // hard drives 2TB
 for(let i=0;i<4;i++){o+=box(30,46+i*4,16,4,'K','k')+G('blink',R(43,47+i*4,1,1,'G'),`--d:${.4+i*.17}s`)+R(32,47+i*4,8,1,'D')}
 o+=T(38,44,5,'2TB','Hd','middle');
 // conveyor belt
 o+=R(46,56,104,6,'K')+R(46,56,104,1,'D');
 for(let i=48;i<150;i+=6)o+=G('spin',`<rect x="${i}" y="58" width="3" height="3" fill="${C.C}"/>`,'--d:.6s');
 // image tiles moving
 for(let i=0;i<5;i++){
  const tile=box(46,48,9,8,'#1d1238','k')+R(48,50,2,2,'G')+R(51,52,2,2,'P')+R(49,53,1,1,'B')+R(52,49,1,1,'G');
  o+=G('mv',tile,`--dx:96px;--d:7s;--dl:${-i*1.4}s`);
 }
 // python processor
 o+=box(76,30,30,26,'B','k')+R(77,31,28,3,'Bd');

 o+=G('blink',`<rect x="83" y="39" width="7" height="7" fill="none" stroke="${C.Y}" stroke-width="1"/>`,'--d:.7s');

 o+=R(79,51,24,4,'Y')+T(91,54.5,3.5,'PYTHON','k','middle');
 o+=G('spin',SP(['.k.','kYk','.k.'],78,26),'--d:1.2s')+G('spin',SP(['.k.','kYk','.k.'],101,26),'--d:1.2s');
 o+=T(91,24,4,'FIJI + ZEN','Bd','middle');
 // QC gate
 o+=box(124,34,22,22,'w','k')+T(135,40,4,'QC','k','middle');
 o+=R(126,43,18,3,'c')+G('growx',R(126,43,18,3,'G'),'--d:3s')+T(135,51,3,'BOOTSTRAP','D','middle');
 // check pile
 for(let i=0;i<3;i++)o+=G('pop',SP(['....G','...GG','G.GG.','GGG..','.G...'],128+i*5,28),`--d:3s;--dl:${i*.6}s`);
 // human review desk (only uncertain)
 o+=person(150,48,'H')+G('bob',SP(['kk','kb'],148,51),'--d:1.4s');
 o+=G('blink',T(147,46,4,'?','R','middle'),'--d:1.4s');
 // big stats
 o+=box(4,24,40,14,'H','Hd')+T(24,31,6,'-60 HRS','w','middle')+T(24,36,3.5,'PER EXPERIMENT','p','middle');
 o+=box(56,70,46,14,'Hd','k')+T(79,78,7,'97%','w','middle')+T(79,82.5,3.2,'MATCH WITH EXPERTS','p','middle');
 return svg(o,'#fbeef6');};
