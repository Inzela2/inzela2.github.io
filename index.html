<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inzela Mirza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Nunito:wght@400;600;800;900&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --display:'JetBrains Mono',ui-monospace,monospace;
  --body:'Nunito','Segoe UI',system-ui,sans-serif;
  --bg:#0d2346; --bg2:#13305c; --ink:#10264d; --muted:#3b5f8f;
  --hot:#2f7de1; --hot-dk:#1b4f9c; --soft:#8cc4ff; --cream:#ffffff;
  --grid:rgba(120,170,255,.07);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d2346}}
:root[data-theme="dark"]{--bg:#0d2346}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:inherit}
[hidden]{display:none!important}
body{
  margin:0;font-family:var(--body);color:var(--ink);line-height:1.55;
  background-color:var(--bg);
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px),
    radial-gradient(ellipse at 50% 35%,var(--bg2) 0%,transparent 65%);
  background-size:28px 28px,28px 28px,100% 100%;
  min-height:100vh;overflow-x:hidden;
}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--hot);outline-offset:3px}

/* floating pixel confetti in background */
.bits{display:none;position:fixed;inset:0;pointer-events:none;z-index:0}
.bits i{position:absolute;width:8px;height:8px;background:var(--soft);animation:drift 9s steps(18) infinite}
@keyframes drift{0%{transform:translateY(0);opacity:0}15%{opacity:.8}100%{transform:translateY(-140px);opacity:0}}

/* header */
.top{position:relative;z-index:2;text-align:center;padding:22px 16px 0}
.switch{position:absolute;right:clamp(12px,3vw,32px);top:18px;display:flex;gap:4px;background:var(--cream);border:3px solid var(--hot);border-radius:12px;padding:3px;box-shadow:0 4px 0 var(--hot-dk)}
.switch button{border:0;background:transparent;border-radius:8px;padding:6px 12px;font-weight:900;font-size:13px;color:var(--muted)}
.switch button[aria-pressed="true"]{background:var(--hot);color:#fff}
h1.name{
  font-family:var(--display);font-weight:700;margin:0;line-height:1.05;
  font-size:clamp(40px,8.5vw,96px);color:var(--cream);letter-spacing:.01em;
  text-shadow:3px 3px 0 var(--hot),6px 6px 0 var(--hot-dk),9px 9px 0 rgba(58,16,40,.25);
}
.sub{margin:14px auto 0;font-weight:800;font-size:clamp(15px,2.2vw,20px);color:var(--hot-dk);
  display:inline-block;padding:0 12px;max-width:min(1000px,100%);line-height:1.3;font-weight:900;font-size:clamp(18px,2.3vw,26px)}
.sub{color:#eef6ff;text-shadow:0 2px 0 rgba(3,10,28,.65)}
.sub span{display:block;margin-top:6px;font-weight:800;font-size:clamp(13px,1.35vw,16px);color:#b9d6fb;letter-spacing:.02em}
.ribbon{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%) rotate(-3deg);white-space:nowrap;background:var(--ink);color:#fff;font-family:var(--display);font-size:10.5px;padding:5px 10px;border-radius:6px;box-shadow:0 3px 0 var(--hot);z-index:2}
.bubble.feat{border-color:var(--ink);border-width:5px}
.bubble.feat .kind{background:var(--ink);font-size:11px;padding:2px 9px}

/* ---------- bubbles ---------- */
.bubble{
  --s:178px;position:absolute;width:var(--s);height:var(--s);border-radius:50%;
  background:var(--cream);border:4px solid var(--hot);
  box-shadow:0 7px 0 var(--hot-dk),0 14px 26px rgba(27,79,156,.25);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  padding:16px 14px;text-align:center;transform:translate(-50%,-50%);
  transition:transform .15s ease,box-shadow .15s ease;z-index:4;
}
.bubble::before{ /* lego studs ring */
  content:"";position:absolute;inset:7px;border-radius:50%;border:2px dashed var(--soft);pointer-events:none;
}
.bubble:hover,.bubble:focus-visible{transform:translate(-50%,calc(-50% - 6px));box-shadow:0 13px 0 var(--hot-dk),0 22px 30px rgba(27,79,156,.3)}
.bubble:active{transform:translate(-50%,calc(-50% + 3px));box-shadow:0 3px 0 var(--hot-dk)}
.bubble svg{width:46px;height:46px;image-rendering:pixelated}
.bubble .kind{font-size:10px;font-weight:900;background:var(--hot);color:#fff;border-radius:4px;padding:1px 7px;letter-spacing:.02em}
.bubble .t{font-family:var(--display);font-size:11.5px;line-height:1.2;max-width:128px}
.bubble .st{font-size:11px;font-weight:800;color:var(--muted);line-height:1.2;max-width:130px}

/* ---------- option 1: centre photo ---------- */
.opt1{position:relative;z-index:1;width:min(1240px,100%);margin:0 auto;height:max(700px,calc(100vh - 160px))}
.opt1 .orbit{display:none;position:absolute;left:50%;top:52%;width:80%;height:84%;transform:translate(-50%,-50%);border:3px dashed rgba(232,32,122,.35);border-radius:50%}
.opt1 .orbit2{width:56%;height:64%;border-style:dotted}
.opt1 .halo{position:absolute;left:50%;bottom:4%;width:min(440px,42%);aspect-ratio:1;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(150,205,255,.35) 0%,rgba(120,180,255,.14) 45%,transparent 70%)}
.opt1 .me{position:absolute;left:50%;bottom:26px;height:calc(100% - 46px);transform:translateX(-50%);z-index:2;
  filter:drop-shadow(0 8px 0 rgba(16,38,77,.18))}
#world{position:absolute;left:0;top:0;z-index:0;image-rendering:pixelated;pointer-events:none}
.fg{position:absolute;left:50%;bottom:0;width:100vw;height:66px;transform:translateX(-50%);z-index:3;image-rendering:pixelated;pointer-events:none}
.sign{display:none;position:absolute;left:calc(50% + 150px);bottom:40px;z-index:3;background:#b9773f;color:#fff;font-family:var(--display);font-size:11px;padding:5px 9px;border:3px solid #6b3f1d;box-shadow:inset 0 -3px 0 #8f5a2c}
.sign::after{content:"";position:absolute;left:50%;top:100%;width:6px;height:26px;margin-left:-3px;background:#8f5a2c;border:2px solid #6b3f1d;border-top:0}
.base{display:none;position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(520px,70%);height:48px;z-index:2;
  background:var(--hot);border-radius:8px;box-shadow:0 6px 0 var(--hot-dk);
  background-image:radial-gradient(circle at 50% 40%,#ff5fa6 0 6px,transparent 6.5px);background-size:26px 26px;background-position:0 -2px}
.base span{position:absolute;inset:auto 0 9px;text-align:center;color:#fff;font-family:var(--display);font-size:12px}

/* ---------- option 2: side photo ---------- */
.opt2{position:relative;z-index:1;width:min(1240px,100%);margin:20px auto 0;display:grid;grid-template-columns:1.45fr 1fr;gap:20px;align-items:center;padding:0 clamp(16px,3vw,32px) 40px}
.cluster{position:relative;height:700px}
.cluster svg.traces{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.card{position:relative;background:var(--cream);border:4px solid var(--hot);border-radius:18px;padding:14px 14px 18px;box-shadow:0 8px 0 var(--hot-dk),0 20px 40px rgba(27,79,156,.25);transform:rotate(2deg)}
.card::before{content:"";position:absolute;left:18px;right:18px;top:-14px;height:14px;
  background:radial-gradient(circle at 50% 100%,var(--hot) 0 8px,transparent 8.5px);background-size:30px 14px}
.card img{display:block;width:100%;border-radius:10px;aspect-ratio:675/1000;object-fit:cover}
.card .cap{margin:12px 4px 0;font-weight:700;font-size:15px}
.card .cap b{font-family:var(--display);font-size:13px;color:var(--hot-dk);display:block;margin-bottom:2px}
.tape{position:absolute;top:-6px;right:24px;width:64px;height:22px;background:rgba(255,156,200,.75);transform:rotate(-8deg)}

.contact{position:relative;z-index:2;text-align:center;margin:26px 0 30px;font-weight:700;font-size:14px;color:#a9c8f2}
.contact a{color:#ffffff;font-weight:900}

/* mobile */
@media (max-width:900px){
  .switch{position:static;margin:0 auto 14px;width:max-content}
  .opt1{height:auto;padding-bottom:20px}
  .opt1 .orbit{display:none}
  .opt1 .stagewrap{position:relative;height:62vh;min-height:440px}
  .opt1 .me{height:calc(100% - 22px);bottom:20px}
  .fg{height:50px}
  .sign{display:none}
  .base{height:34px}
  .base span{bottom:5px;font-size:10px}
  .bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 14px;padding:26px 14px 0;justify-items:center}
  .bgrid .bubble{position:relative;left:auto!important;top:auto!important;transform:none;--s:158px}
  .bgrid .bubble:hover{transform:translateY(-6px)}
  .opt2{grid-template-columns:1fr}
  .opt2 .side{order:-1;max-width:340px;margin:10px auto 0}
  .cluster{height:auto}
  .cluster svg.traces{display:none}
}
@media (min-width:901px){.opt1 .stagewrap{position:absolute;inset:0}}

/* ---------- story page ---------- */
.page{position:fixed;inset:0;overflow:auto;z-index:20;display:none;background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
.page{--bg:#e6f2ff;--grid:rgba(47,125,225,.1)}
.space .opt1 .me{-webkit-mask-image:linear-gradient(#000 84%,transparent 99%);mask-image:linear-gradient(#000 84%,transparent 99%)}
.space .fg{display:none}
.page.open{display:block}
.ptop{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:14px;padding:calc(12px + env(safe-area-inset-top,0px)) clamp(14px,4vw,40px) 12px;background:var(--bg);border-bottom:3px solid var(--soft)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.back{display:inline-flex;align-items:center;gap:8px;border:3px solid var(--hot);background:var(--cream);color:var(--hot-dk);border-radius:12px;padding:8px 18px 8px 14px;font-weight:900;font-size:16px;box-shadow:0 5px 0 var(--hot-dk)}
.back:hover{background:var(--hot);color:#fff}
.back:active{transform:translateY(3px);box-shadow:0 2px 0 var(--hot-dk)}
.ptop .crumb{font-family:var(--display);font-size:12px;color:var(--muted);margin-left:auto}
.story{max-width:1000px;margin:0 auto;padding:22px clamp(14px,4vw,40px) 60px}
.story .kind{display:inline-block;font-weight:900;font-size:12px;background:var(--hot);color:#fff;padding:3px 10px;border-radius:6px}
.story h2{font-family:var(--display);font-size:clamp(20px,3.8vw,34px);margin:10px 0 2px;line-height:1.2}
.story .where{color:var(--muted);font-weight:800;margin:0 0 14px}
.impact{margin:0 0 16px;background:var(--cream);border:3px solid var(--hot);border-left-width:12px;border-radius:12px;padding:10px 16px;font-weight:900;font-size:clamp(17px,2.4vw,22px);line-height:1.3;box-shadow:0 5px 0 var(--hot-dk)}
.impact span{display:block;font-family:var(--display);font-size:11px;font-weight:400;color:var(--hot);margin-bottom:2px}
.stackrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 14px}
.stackrow b{font-family:var(--display);font-size:12px;color:var(--hot-dk);margin-right:4px}
.chip{background:var(--cream);border:2px solid var(--hot);padding:4px 11px;border-radius:5px;font-weight:900;font-size:13px;box-shadow:3px 3px 0 var(--hot)}
.scene{background:var(--cream);border:4px solid var(--hot);border-radius:18px;padding:10px;box-shadow:0 8px 0 var(--hot-dk)}
.scene svg{display:block;width:100%;height:auto;border-radius:10px}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:26px 0 0}
.num{background:var(--hot);color:#fff;border-radius:12px;padding:14px 14px 12px;box-shadow:0 6px 0 var(--hot-dk);position:relative}
.num::before{content:"";position:absolute;left:12px;right:12px;top:-8px;height:8px;background:radial-gradient(circle at 50% 100%,var(--hot) 0 6px,transparent 6.5px);background-size:22px 8px}
.num .v{font-family:var(--display);font-size:clamp(20px,3vw,28px);line-height:1.1}
.num .l{font-size:13px;font-weight:800;opacity:.92;line-height:1.3;margin-top:4px}
.beats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px}
.beat{background:var(--cream);border:3px solid var(--soft);border-radius:14px;padding:14px 16px}
.beat h3{font-family:var(--display);font-size:13px;color:var(--hot-dk);margin:0 0 6px}
.beat p{margin:0;font-size:15px}
.links{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.cta{display:inline-flex;align-items:center;gap:8px;text-decoration:none;background:var(--ink);color:#fff;font-weight:900;font-size:16px;padding:12px 20px;border-radius:12px;box-shadow:0 5px 0 var(--hot)}
.cta:hover{background:var(--hot-dk)}
.pnav{display:flex;justify-content:space-between;gap:12px;margin-top:30px}
.pnav button{border:3px solid var(--soft);background:var(--cream);border-radius:12px;padding:10px 14px;font-weight:800;color:var(--muted);text-align:left;max-width:48%}
.pnav button span{display:block;font-family:var(--display);font-size:10px;color:var(--hot)}
@media (max-width:760px){.nums{grid-template-columns:repeat(2,1fr)}.beats{grid-template-columns:1fr}}

/* ---------- phone polish ---------- */
.taphint{display:none}
@media (max-width:900px){
  .top{padding-top:18px}
  .sub{font-size:18px;padding:0 10px}
  .ribbon{font-size:9px;bottom:-14px}
  .taphint{display:block;text-align:center;margin:22px 0 0;font-family:var(--display);font-size:12px;color:#cfe6ff}
  .bgrid{grid-template-columns:repeat(2,1fr)!important;gap:14px 12px!important;padding:14px 12px 96px!important;max-width:440px;margin:0 auto}
  .bgrid .bubble{--s:min(170px,calc((100vw - 48px)/2));padding:10px 8px;gap:2px;margin:0 auto}
  .bgrid .bubble:nth-child(even){transform:translateY(48%)}
  .bgrid .bubble:hover,.bgrid .bubble:focus-visible{transform:none}
  .bgrid .bubble:nth-child(even):hover,.bgrid .bubble:nth-child(even):focus-visible{transform:translateY(48%)}
  .bgrid .bubble:active{transform:translateY(3px)}
  .bgrid .bubble:nth-child(even):active{transform:translateY(calc(48% + 3px))}
  .bubble::before{inset:5px}
  .bubble svg{width:36px;height:36px}
  .bubble .kind{font-size:9.5px}
  .bubble .t{font-size:10px;max-width:78%}
  .bubble .st{font-size:10px;max-width:72%}
  .contact{margin-top:6px}
  .story{padding-top:16px}
  .stackrow{gap:6px}
  .chip{font-size:12px;padding:3px 9px;box-shadow:2px 2px 0 var(--hot)}
  .scene{padding:4px;margin:0 -6px;border-width:3px;border-radius:14px}
  .scene svg{border-radius:9px}
  .nums{gap:16px 10px}
  .num{padding:12px 12px 10px}
  .num .l{font-size:12px}
  .beat p{font-size:14.5px}
  .cta{width:100%;justify-content:center}
}

/* ---------- pixel animations (SVG) ---------- */
svg .mv{animation:mv var(--d,4s) linear infinite;animation-delay:var(--dl,0s)}
@keyframes mv{from{transform:translate(0,0)}to{transform:translate(var(--dx,0px),var(--dy,0px))}}
svg .mvs{animation:mvs var(--d,4s) steps(var(--n,20)) infinite;animation-delay:var(--dl,0s)}
@keyframes mvs{from{transform:translate(0,0)}to{transform:translate(var(--dx,0px),var(--dy,0px))}}
svg .fly{animation:fly var(--d,3s) steps(14) infinite;animation-delay:var(--dl,0s)}
@keyframes fly{0%{transform:translate(0,0);opacity:0}10%{opacity:1}85%{opacity:1}100%{transform:translate(var(--dx,0px),var(--dy,0px));opacity:0}}
svg .blink{animation:blink var(--d,1s) steps(1) infinite;animation-delay:var(--dl,0s)}
@keyframes blink{50%{opacity:0}}
svg .bob{animation:bob var(--d,1s) steps(1) infinite;animation-delay:var(--dl,0s)}
@keyframes bob{50%{transform:translateY(-1px)}}
svg .bob2{animation:bob2 var(--d,1.2s) steps(1) infinite;animation-delay:var(--dl,0s)}
@keyframes bob2{50%{transform:translateY(-2px)}}
svg .spin{transform-box:fill-box;transform-origin:center;animation:spin var(--d,1s) steps(8) infinite}
@keyframes spin{to{transform:rotate(360deg)}}
svg .pop{transform-box:fill-box;transform-origin:50% 100%;animation:pop var(--d,4s) steps(6) infinite;animation-delay:var(--dl,0s)}
@keyframes pop{0%,8%{transform:scale(0)}20%,85%{transform:scale(1)}100%{transform:scale(0)}}
svg .grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow var(--d,4s) steps(8) infinite;animation-delay:var(--dl,0s)}
@keyframes grow{0%{transform:scaleY(.1)}60%,90%{transform:scaleY(1)}100%{transform:scaleY(.1)}}
svg .growx{transform-box:fill-box;transform-origin:0 50%;animation:growx var(--d,4s) steps(10) infinite;animation-delay:var(--dl,0s)}
@keyframes growx{0%{transform:scaleX(.05)}70%,92%{transform:scaleX(1)}100%{transform:scaleX(.05)}}
svg .pulse{transform-box:fill-box;transform-origin:center;animation:pulse var(--d,2s) steps(6) infinite;animation-delay:var(--dl,0s)}
@keyframes pulse{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.3);opacity:0}}
svg .scany{animation:scany var(--d,3s) steps(16) infinite alternate}
@keyframes scany{to{transform:translateY(var(--dy,20px))}}
svg .fade{animation:fade var(--d,2s) steps(2) infinite;animation-delay:var(--dl,0s)}
@keyframes fade{0%,100%{opacity:.25}50%{opacity:.85}}
@media (prefers-reduced-motion:reduce){*,svg *{animation:none!important;transition:none!important}.bits{display:none}}
/* ================= TECH SKIN ================= */
:root{--head:'Space Grotesk','Segoe UI',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;--cy:#5fd0ff;--cy2:#9fe3ff;--line:rgba(110,200,255,.38)}
h1.name{font-family:var(--head);font-weight:700;letter-spacing:-.03em;font-size:clamp(46px,8.2vw,108px);line-height:1;
  color:#fff;background:linear-gradient(180deg,#ffffff 30%,#9fd8ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  text-shadow:none;filter:drop-shadow(0 0 28px rgba(95,190,255,.35))}
.top .kicker{display:block;font-family:var(--mono);font-size:12px;letter-spacing:.24em;color:var(--cy);margin:0 0 12px;text-transform:uppercase}
.sub{font-family:var(--head);font-weight:600;letter-spacing:-.01em}
.sub span{font-family:var(--mono);font-weight:500;letter-spacing:.04em;font-size:clamp(12px,1.2vw,14.5px);color:#8fd0ff;margin-top:10px}
.sub span::after{content:"";display:inline-block;width:8px;height:1.05em;background:var(--cy);margin-left:6px;vertical-align:-2px;animation:caret 1.1s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
.switch{background:rgba(6,16,36,.72);border:1px solid var(--line);box-shadow:none;border-radius:8px;backdrop-filter:blur(6px)}
.switch button{font-family:var(--mono);font-weight:500;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:#9cc2ea;border-radius:5px}
.switch button[aria-pressed="true"]{background:var(--cy);color:#04122a}
.opt1 .halo{background:radial-gradient(circle,rgba(95,190,255,.22) 0%,rgba(95,190,255,.08) 45%,transparent 70%)}
/* nodes */
.bubble{background:rgba(6,18,40,.66);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);
  border:1px solid var(--line);box-shadow:0 0 0 1px rgba(110,200,255,.06),0 0 26px rgba(50,150,255,.16),inset 0 0 32px rgba(60,160,255,.08);color:#e6f2ff;gap:4px}
.bubble::before{inset:-8px;border:1px dashed rgba(110,200,255,.28);animation:ring 30s linear infinite}
@keyframes ring{to{transform:rotate(360deg)}}
.bubble::after{content:attr(data-n);position:absolute;top:13px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:rgba(150,210,255,.6)}
.bubble:hover,.bubble:focus-visible{transform:translate(-50%,-50%) scale(1.05);border-color:var(--cy);box-shadow:0 0 0 1px rgba(95,208,255,.5),0 0 44px rgba(60,160,255,.42),inset 0 0 32px rgba(60,160,255,.14)}
.bubble:active{transform:translate(-50%,-50%) scale(.98);box-shadow:0 0 30px rgba(60,160,255,.3)}
.bubble svg{width:40px;height:40px;margin-top:6px}
.bubble .kind{background:transparent;color:var(--cy);border:1px solid rgba(95,208,255,.5);font-family:var(--mono);font-weight:500;text-transform:uppercase;font-size:9px;letter-spacing:.12em;border-radius:3px;padding:1px 7px}
.bubble .t{font-family:var(--head);font-weight:600;font-size:13.5px;line-height:1.2;color:#fff;max-width:132px}

.impact span{font-family:var(--mono);color:var(--cy);letter-spacing:.14em;text-transform:uppercase;font-size:10.5px}

.scene{position:relative;background:#040b1c;border:1px solid rgba(110,200,255,.35);border-radius:10px;box-shadow:0 0 34px rgba(50,150,255,.14);padding:8px}

.num{background:rgba(95,208,255,.06);border:1px solid rgba(95,208,255,.28);box-shadow:none;border-radius:8px;color:#d7e6fb}
.num::before{display:none}
.num .v{font-family:var(--head);font-weight:700;color:var(--cy2);letter-spacing:-.02em}

/* ================= NIGHT OBSERVATORY ================= */
body{background:#05080f;color:#dfe7f3}
.wrap{position:relative}
.hero{position:relative;height:100vh;height:100svh;min-height:600px;overflow:hidden;background:#04070f}
#sky{position:absolute;left:0;top:0;z-index:0;image-rendering:pixelated;pointer-events:none}
.hhead{position:absolute;z-index:5;left:5%;top:calc(env(safe-area-inset-top,0px) + max(7vh,40px));max-width:500px}
.hhead .kicker{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.3em;color:#86a8d4;text-transform:uppercase}
.hhead h1{font-family:var(--head);font-weight:600;font-size:clamp(36px,4.4vw,58px);letter-spacing:-.035em;line-height:1;margin:14px 0 14px;color:#f2f5fa}
.hhead .lead{font-family:var(--head);font-weight:400;font-size:clamp(15px,1.25vw,17.5px);line-height:1.5;color:#c3d0e3;margin:0;max-width:420px}
.hhead .meta{font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;color:#7f9fc8;margin:16px 0 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hhead .meta i{width:6px;height:6px;border-radius:50%;background:#6ee7a8;box-shadow:0 0 8px #6ee7a8;display:inline-block}
.hint{margin:22px 0 0;font-family:var(--mono);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:#6f8fba}
/* constellation */
.cons{position:absolute;inset:0;z-index:4;pointer-events:none}
.cons svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.cons line{stroke:rgba(170,200,255,.16);stroke-width:1}
.star{position:absolute;pointer-events:auto;background:none;border:0;padding:10px;margin:0;display:flex;align-items:center;gap:12px;color:#dfe8f6;transform:translate(-18px,-50%);border-radius:8px}
.star.left{flex-direction:row-reverse;transform:translate(calc(-100% + 18px),-50%)}
.star .pt{position:relative;width:16px;height:16px;flex:none;transition:transform .25s}
.star .pt::before,.star .pt::after{content:"";position:absolute;background:#f4f8ff;box-shadow:0 0 6px rgba(190,220,255,.9)}
.star .pt::before{left:7px;top:2px;width:2px;height:12px}
.star .pt::after{top:7px;left:2px;width:12px;height:2px}
.star .pt i{position:absolute;inset:-10px;border-radius:50%;background:radial-gradient(circle,rgba(150,200,255,.32),transparent 62%);animation:tw 3.2s ease-in-out infinite}
.star:nth-child(2n) .pt i{animation-delay:-1.3s}.star:nth-child(3n) .pt i{animation-delay:-2.1s}
@keyframes tw{0%,100%{opacity:.55;transform:scale(.85)}50%{opacity:1;transform:scale(1.1)}}
.star .lbl{display:flex;flex-direction:column;text-align:left;white-space:nowrap;gap:2px}
.star.left .lbl{text-align:right;align-items:flex-end}
.star .ix{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;color:#7f9fc8;text-transform:uppercase}
.star .nm{font-family:var(--head);font-size:14px;font-weight:500;color:#e9eff9;letter-spacing:-.005em}
.star .mt{font-family:var(--mono);font-size:10.5px;color:#9cc3ee;max-height:0;opacity:0;overflow:hidden;transition:max-height .25s,opacity .25s}
.star:hover .mt,.star:focus-visible .mt{max-height:18px;opacity:1}
.star:hover .pt,.star:focus-visible .pt,.star.ping .pt{transform:scale(1.45)}
.star:hover .nm,.star:focus-visible .nm{color:#fff}
.star:focus-visible{outline:1px solid rgba(150,200,255,.6)}
.star.feat .pt::before,.star.feat .pt::after{background:#bfeaff;box-shadow:0 0 10px rgba(110,210,255,1)}
.star.feat .pt{width:20px;height:20px}.star.feat .pt::before{left:9px;height:16px}.star.feat .pt::after{top:9px;width:16px}
.star.feat .pt i{background:radial-gradient(circle,rgba(95,208,255,.45),transparent 62%);inset:-14px}
.star .tag{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#04122a;background:#8fdcff;padding:1px 6px;border-radius:2px;margin-left:6px}
/* photo */
.me-card{position:absolute;z-index:5;right:4.5%;bottom:6%;width:min(196px,15vw,22vh);background:#fff;padding:7px 7px 10px;border-radius:3px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.me-card img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.me-card p{margin:9px 3px 0;font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:#4a5870;line-height:1.55}
.me-card p b{display:block;font-family:var(--head);font-size:13.5px;letter-spacing:-.01em;color:#0d1626;font-weight:600;margin-bottom:1px}
.plist{display:none}
.cmd{position:absolute;z-index:5;right:5%;top:calc(env(safe-area-inset-top,0px) + 22px);margin:0;font-family:var(--mono);font-size:12.5px;letter-spacing:.05em;color:#6ee7a8;text-shadow:0 0 10px rgba(110,231,168,.4)}
.cmd::after{content:"_";margin-left:2px;animation:caret 1.1s steps(1) infinite}
@media (max-width:900px){.cmd{left:0;right:0;text-align:center;top:auto;bottom:17%;font-size:11.5px}}
.foot{position:relative;z-index:2;text-align:center;padding:22px 16px 30px;font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;color:#6f8fba;background:#05080f;border-top:1px solid rgba(150,190,240,.1)}
.foot a{color:#dfe7f3;text-decoration:none;border-bottom:1px solid rgba(150,200,255,.35)}
.foot a:hover{color:#9cd6ff}
@media (max-width:900px){
  .hero{height:max(560px,80vh)}
  .hhead{left:0;right:0;padding:0 22px;max-width:none;text-align:center;top:calc(env(safe-area-inset-top,0px) + 30px)}
  .hhead h1{font-size:clamp(34px,10vw,46px)}
  .hhead .lead{margin:0 auto}
  .hhead .meta{justify-content:center}
  .hint{display:none}
  .star{padding:8px}.star .lbl{display:none}
  .me-card{position:static;width:auto;margin:0 18px;display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;padding:8px}
  .me-card p{margin:0}
  .plist{display:block;padding:26px 18px 6px}
  .plist h2{font-family:var(--mono);font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:#7f9fc8;font-weight:400;margin:0 0 12px}
  .prow{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:rgba(255,255,255,.025);border:1px solid rgba(150,190,240,.14);border-radius:8px;padding:12px 14px;margin:0 0 10px;color:#e6eef9}
  .prow .ix{font-family:var(--mono);font-size:11px;color:#7f9fc8}
  .prow .nm{display:block;font-family:var(--head);font-size:15px;font-weight:500}
  .prow .mt{display:block;font-family:var(--mono);font-size:10.5px;color:#9cc3ee;margin-top:2px}
  .prow .kd{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#7f9fc8}
  .prow.feat{border-color:rgba(143,220,255,.5)}.prow.feat .kd{color:#04122a;background:#8fdcff;padding:1px 6px;border-radius:2px}
}

.star:hover .lbl::after,.star:focus-visible .lbl::after{opacity:1;right:7px}

.star:focus-visible{outline:none}

<script>
/* ================= pixel toolkit ================= */
const C={k:'#1f1430',K:'#3b2a4d',w:'#ffffff',n:'#f4eef7',c:'#d6cbe0',C:'#9a8aa8',D:'#5d4e6d',
 p:'#bfe3ff',P:'#ff5fa6',H:'#1f6feb',Hd:'#0b3a8c',m:'#d8c4ff',M:'#8b5cf6',Md:'#5b2fc4',
 b:'#9fd4ff',B:'#3b82f6',Bd:'#1e40af',s:'#e0f2ff',g:'#86efac',G:'#22c55e',Gd:'#15803d',l:'#d9f99d',
 y:'#fde68a',Y:'#facc15',Yd:'#ca8a04',o:'#fdba74',O:'#f97316',r:'#fca5a5',R:'#ef4444',Rd:'#b91c1c',
 t:'#e6c39a',T:'#a0683a',Td:'#6b3f1d',d:'#f2c4a2',dd:'#c98b62',x:'#7a4a2c'};
const R=(x,y,w,h,f,a='')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${C[f]||f}" ${a}/>`;
const T=(x,y,s,txt,f='k',anchor='start',a='')=>`<text x="${x}" y="${y}" font-family="Silkscreen,monospace" font-size="${s}" fill="${C[f]||f}" text-anchor="${anchor}" ${a}>${txt}</text>`;
const G=(cls,inner,st='')=>`<g class="${cls}" style="${st}">${inner}</g>`;
/* sprite: rows of chars, '.' transparent, map chars to palette keys */
const SP=(rows,x,y,map={})=>{let o='';rows.forEach((row,j)=>{let i=0;while(i<row.length){const ch=row[i];if(ch==='.'){i++;continue}let k=i;while(k<row.length&&row[k]===ch)k++;const col=map[ch]||C[ch];if(col)o+=`<rect x="${x+i}" y="${y+j}" width="${k-i}" height="1" fill="${C[col]||col}"/>`;i=k}});return o};
/* lego brick with studs */
const brick=(x,y,w,h,f,dk)=>{let o=R(x,y,w,h,f)+R(x,y+h-1,w,1,dk)+R(x,y,1,h,'#ffffff','opacity=".25"');for(let i=x+1;i<x+w-1;i+=4)o+=R(i,y-1,2,1,f);return o};
const box=(x,y,w,h,f,line='k')=>R(x,y,w,h,line)+R(x+1,y+1,w-2,h-2,f);
const svg=(inner,bg)=>`<svg viewBox="0 0 160 90" shape-rendering="crispEdges" role="img">${R(0,0,160,90,bg)}${inner}</svg>`;
const person=(x,y,shirt,hair='k',skin='d')=>SP(['.hhh.','hsss.','.sss.','ttttt','tttt.','.LL..','.L.L.'],x,y,{h:hair,s:skin,t:shirt,L:'K'});

/* ================= scenes ================= */
const scenes={};

scenes.inventia=()=>{let o='';
 // wall + shelf
 o+=R(0,0,160,62,'#e9f1fb');for(let i=0;i<160;i+=16)o+=R(i,0,1,62,'#d9e4f2');
 o+=R(4,10,46,2,'T')+R(4,12,46,1,'Td');
 [['b',6],['p',12],['g',18],['y',24],['m',30],['b',36],['P',42]].forEach(([c,x],i)=>{o+=R(x,3,4,7,c)+R(x+1,2,2,1,'C')+R(x,3,4,1,'w','opacity=".5"')});
 // window with DNA-ish poster
 o+=box(58,6,24,18,'s','C')+R(69,7,1,16,'C')+R(59,14,22,1,'C');
 o+=box(122,6,30,22,'w','H')+T(137,13,4,'DRUG','Hd','middle')+T(137,18,4,'SCREEN','Hd','middle')+T(137,24,4,'x4','H','middle');
 // bench
 o+=R(0,62,160,4,'C')+R(0,66,160,2,'D')+R(0,68,160,22,'#e9dff0');
 for(let i=0;i<160;i+=8)o+=R(i,76,8,1,'c');
 o+=R(6,68,3,22,'D')+R(150,68,3,22,'D');
 // microscope (detailed)
 o+=SP([
 '......kkkk......',
 '......kCCk......',

 'kkkkkkkkkkkkkkkk'],8,41,{d:'Hd'});
 o+=G('blink',R(14,56,2,2,'Y'),'--d:.8s');
 // well plate on stage
 o+=box(9,51,10,4,'w','k');for(let i=0;i<4;i++)o+=G('blink',R(10+i*2,52,1,1,['G','P','B','Y'][i]),`--d:${1+i*.3}s`);
 // hard drives 2TB
 for(let i=0;i<4;i++){o+=box(30,46+i*4,16,4,'K','k')+G('blink',R(43,47+i*4,1,1,'G'),`--d:${.4+i*.17}s`)+R(32,47+i*4,8,1,'D')}
 o+=T(38,44,5,'2TB','Hd','middle');
 // conveyor belt
 o+=R(46,56,104,6,'K')+R(46,56,104,1,'D');
 for(let i=48;i<150;i+=6)o+=G('spin',`<rect x="${i}" y="58" width="3" height="3" fill="${C.C}"/>`,'--d:.6s');
 // image tiles moving
 for(let i=0;i<5;i++){
  const tile=box(46,48,9,8,'#1d1238','k')+R(48,50,2,2,'G')+R(51,52,2,2,'P')+R(49,53,1,1,'B')+R(52,49,1,1,'G');
  o+=G('mv',tile,`--dx:96px;--d:7s;--dl:${-i*1.4}s`);
 }
 // python processor
 o+=box(76,30,30,26,'B','k')+R(77,31,28,3,'Bd');

 o+=R(79,51,24,4,'Y')+T(91,54.5,3.5,'PYTHON','k','middle');
 o+=G('spin',SP(['.k.','kYk','.k.'],78,26),'--d:1.2s')+G('spin',SP(['.k.','kYk','.k.'],101,26),'--d:1.2s');
 o+=T(91,24,4,'FIJI + ZEN','Bd','middle');
 // QC gate
 o+=box(124,34,22,22,'w','k')+T(135,40,4,'QC','k','middle');
 o+=R(126,43,18,3,'c')+G('growx',R(126,43,18,3,'G'),'--d:3s')+T(135,51,3,'BOOTSTRAP','D','middle');
 // check pile
 for(let i=0;i<3;i++)o+=G('pop',SP(['....G','...GG','G.GG.','GGG..','.G...'],128+i*5,28),`--d:3s;--dl:${i*.6}s`);
 // human review desk (only uncertain)
 o+=person(150,48,'H')+G('bob',SP(['kk','kb'],148,51),'--d:1.4s');
 o+=G('blink',T(147,46,4,'?','R','middle'),'--d:1.4s');
 // big stats
 o+=box(4,24,40,14,'H','Hd')+T(24,31,6,'-60 HRS','w','middle')+T(24,36,3.5,'PER EXPERIMENT','p','middle');
 o+=box(56,70,46,14,'Hd','k')+T(79,78,7,'97%','w','middle')+T(79,82.5,3.2,'MATCH WITH EXPERTS','p','middle');
 return svg(o,'#e9f1fb');};

  lastT=0;if(reduce)draw(0);else if(!raf)raf=requestAnimationFrame(loop);
 }
 const station=["BBB.BBB.....BBB.BBB","bbb.bbb..r..bbb.bbb","BBB.BBB..c..BBB.BBB","..c...c.ccc.c...c..","wwwwwwwwwwwwwwwwwww","..c...c.ccc.c...c..","BBB.BBB..c..BBB.BBB","bbb.bbb.....bbb.bbb","BBB.BBB.....BBB.BBB"];
 const SC={B:'#23408f',b:'#2f53b0',w:'#aeb6c4',c:'#7d8797',r:'#ff4d4d'};
 function draw(t){
  if(!frame)frame=cx.createImageData(W,H);
  const d=frame.data;d.set(base.getContext('2d').getImageData(0,0,W,H).data);
  // earth
  const rot=t*1.2,crot=t*1.8,{px,gl}=earth;
  for(let i=0;i<px.length;i+=5){const q=px[i]*4,v=px[i+1],u=((Math.floor(px[i+2]+rot)%TW)+TW)%TW,lam=px[i+3],d2=px[i+4],ti=v*TW+u;
   let r_=texL[ti*3],g_=texL[ti*3+1],b_=texL[ti*3+2];
   const cu=((Math.floor(px[i+2]+crot)%TW)+TW)%TW,ca=texC[v*TW+cu];if(ca>0){const a=ca>.5?.85:.5;r_+=(205-r_)*a;g_+=(210-g_)*a;b_+=(220-b_)*a}
   let sh=lam>.35?.95:lam>.12?.7:lam>-.05?.42:.16;
   r_*=sh;g_*=sh;b_*=sh;
   if(lam<=-.05&&texN[ti]&&ca===0){r_=255;g_=205;b_=120}
   if(d2>.985){const a=Math.min(1,(d2-.985)/.015)*.7;r_+=(80-r_)*a;g_+=(165-g_)*a;b_+=(255-b_)*a}
   d[q]=r_;d[q+1]=g_;d[q+2]=b_}
  for(let i=0;i<gl.length;i+=2){const q=gl[i]*4,dist=gl[i+1];let a=Math.pow(1-dist/14,2.4)*.85;if(dist<1.4)a=.95;const cr=dist<1.4?150:50,cg=dist<1.4?205:130;d[q]+=(cr-d[q])*a;d[q+1]+=(cg-d[q+1])*a;d[q+2]+=(255-d[q+2])*a}
  cx.putImageData(frame,0,0);
  for(const s of tw){const v=Math.sin(t*1.5+s.p);if(v<0)continue;cx.fillStyle=`rgba(240,245,255,${(.4+.6*v).toFixed(2)})`;cx.fillRect(s.x,s.y,1,1);if(v>.75){cx.fillStyle=`rgba(240,245,255,${(.35*v).toFixed(2)})`;cx.fillRect(s.x-1,s.y,3,1);cx.fillRect(s.x,s.y-1,1,3)}}
  const sx=W+11-((t*1.4)%(W+60)),sy=H*.09+Math.sin(t*.1)*2;
  station.forEach((row,j)=>{for(let i=0;i<row.length;i++){const ch=row[i];if(ch==='.')continue;if(ch==='r'&&Math.floor(t*1.2)%2)continue;P(cx,SC[ch],sx+i,sy+j)}});
  // island + her (drawn small, then scaled up crisply)
  const K=innerWidth<=900?1:2,SW=72,SH=64;if(!scr){scr=document.createElement('canvas');scr.width=SW;scr.height=SH;sg=scr.getContext('2d')}
  sg.clearRect(0,0,SW,SH);const bob=Math.round(Math.sin(t*1.1));
  sg.drawImage(isle,0,30+bob);
  crystals.forEach(([x,y],i)=>{const v=.5+.5*Math.sin(t*2+i);sg.fillStyle=`rgba(100,235,215,${(.45+.5*v).toFixed(2)})`;sg.fillRect(x,30+bob+y,1,2)});
  for(let i=0;i<3;i++){const p=((t*.6+i/3)%1);sg.fillStyle=`rgba(120,200,255,${((1-p)*.5).toFixed(2)})`;sg.fillRect(24+i*5,48+bob+Math.round(p*12),1,1)}
  const sx0=24,sy0=18+bob;sprite(sg,sx0,sy0,t);
  for(let i=0;i<6;i++){if((i+Math.floor(t*6))%2)continue;sg.fillStyle='rgba(120,210,255,.45)';sg.fillRect(sx0+9+i,sy0+11-i*2,1,1)}
  holo(sg,sx0+15,sy0-12,t);
  const X0=me.x-24*K,Y0=me.y-34*K;cx.imageSmoothingEnabled=false;cx.drawImage(scr,X0,Y0,SW*K,SH*K);
  const hx0=X0+(sx0+15)*K,hy0=Y0+(sy0-12)*K;
  // sparks to stars
  if(t>nextSpark&&starPts.length){const tgt=starPts[Math.floor(Math.random()*starPts.length)];sparks.push({t0:t,x0:hx0+12*K,y0:hy0,tx:tgt[0],ty:tgt[1],el:tgt[2],trail:[]});nextSpark=t+4.2}
  sparks=sparks.filter(s=>{const p=Math.min(1,(t-s.t0)/2),e=1-Math.pow(1-p,2),mx=(s.x0+s.tx)/2,my=Math.min(s.y0,s.ty)-24;
   const x=(1-e)*(1-e)*s.x0+2*(1-e)*e*mx+e*e*s.tx,y=(1-e)*(1-e)*s.y0+2*(1-e)*e*my+e*e*s.ty;s.trail.push([x,y]);if(s.trail.length>16)s.trail.shift();
   s.trail.forEach(([a,b],i)=>{cx.fillStyle=`rgba(150,225,255,${(i/s.trail.length*.7).toFixed(2)})`;cx.fillRect(Math.round(a),Math.round(b),1,1)});
   cx.fillStyle='#e8fbff';cx.fillRect(Math.round(x),Math.round(y),1,1);
   if(p>=1){s.el.classList.add('ping');setTimeout(()=>s.el.classList.remove('ping'),800);return false}return true});
 }
 function loop(time){raf=requestAnimationFrame(loop);if(document.getElementById('page').classList.contains('open'))return;if(!lastT||time-lastT>100){draw(time/1000);lastT=time}}
 return {build};

const POSM={inventia:[.22,.40],farm:[.42,.36],nlp:[.66,.40],edu:[.84,.46],kismat:[.70,.54],shadow:[.48,.52],iiit:[.28,.56],paperpal:[.14,.50]};

items.forEach((it,i)=>{const n=String(i+1).padStart(2,'0'),feat=it.id==='inventia';
 const b=document.createElement('button');b.type='button';b.className='star'+(feat?' feat':'');b.dataset.id=it.id;

 const r=document.createElement('button');r.type='button';r.className='prow'+(feat?' feat':'');r.dataset.id=it.id;

/* ================= story pages ================= */
const page=document.getElementById('page'),story=document.getElementById('story'),crumb=document.getElementById('crumb');
let current=null;
function openPage(id){
 const i=items.findIndex(x=>x.id===id);if(i<0)return;const it=items[i];current=id;
 const prev=items[(i-1+items.length)%items.length],next=items[(i+1)%items.length];
 crumb.textContent=`${i+1} of ${items.length}`;
 story.innerHTML=`
  <span class="kind">${it.kind}</span>
  <h2>${it.title}</h2>
  <p class="where">${it.org}, ${it.when}</p>
  <p class="impact"><span>Main result</span>${it.impact}</p>
  <div class="stackrow"><b>${it.stackLabel||'Tech stack'}</b>${it.stack.map(s=>`<span class="chip">${s}</span>`).join('')}</div>
  <div class="scene">${scenes[it.id]()}</div>
  <div class="nums">${it.nums.map(([v,l])=>`<div class="num"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('')}</div>
  <div class="beats">${it.beats.map(([h,p])=>`<div class="beat"><h3>${h}</h3><p>${p}</p></div>`).join('')}</div>
  ${it.links?`<div class="links">${it.links.map(([t,u])=>`<a class="cta" href="${u}" target="_blank" rel="noopener">${t} &#8594;</a>`).join('')}</div>`:''}
  <div class="pnav"><button type="button" data-go="${prev.id}"><span>Previous</span>${prev.short}</button><button type="button" data-go="${next.id}"><span>Next</span>${next.short}</button></div>`;
 story.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>openPage(b.dataset.go)));
 page.classList.add('open');page.scrollTo(0,0);document.body.style.overflow='hidden';document.getElementById('back').focus();
}
function closePage(){page.classList.remove('open');document.body.style.overflow='';
 if(current){const b=document.querySelector(`.star[data-id="${current}"]`);if(b)b.focus()}current=null}
document.getElementById('back').addEventListener('click',closePage);
addEventListener('keydown',e=>{if(e.key==='Escape'&&current)closePage()});
